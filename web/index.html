<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA 关注球员实时提醒面板</title>
<style>
  :root{
    --bg:#080e1a; --panel:#111b2e; --panel2:#17233a; --line:#22314d;
    --txt:#e8eefc; --dim:#8fa2c4; --muted:#5d7093;
    --orange:#ff6a3d; --blue:#4d92ff; --green:#2fd47b; --red:#ff4d5e;
    --amber:#ffb547; --purple:#a97bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 20% -10%,#152644 0%,transparent 60%),var(--bg);
       color:var(--txt);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       min-height:100vh;padding:22px 26px 40px}
  a{color:var(--blue)}
  .wrap{max-width:1400px;margin:0 auto}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .logo{font-size:20px;font-weight:800;letter-spacing:.5px}
  .logo b{color:var(--orange)}
  .badge{display:inline-flex;align-items:center;gap:7px;background:var(--panel);
         border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
  .dot.off{background:var(--red)}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
         border-radius:8px;padding:7px 13px;cursor:pointer;font-size:12px;transition:.15s}
  button:hover{border-color:var(--blue);background:#1d2c49}
  button.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
  button.primary:hover{background:#ff8159}
  input{background:#0c1526;border:1px solid var(--line);color:var(--txt);
        border-radius:8px;padding:8px 11px;font-size:12px;outline:none;min-width:0}
  input:focus{border-color:var(--blue)}

  .grid{display:grid;grid-template-columns:370px 1fr;gap:18px}
  @media(max-width:980px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(160deg,var(--panel) 0%,#0e1728 100%);
        border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;
        box-shadow:0 8px 30px rgba(0,0,0,.22)}
  .card h2{font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--dim);
           text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:3px;height:13px;background:var(--orange);border-radius:2px}

  /* 比赛卡片 */
  .match{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .team{flex:1;text-align:center}
  .abbr{font-size:12px;color:var(--dim);letter-spacing:1px;font-weight:700}
  .score{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .meta{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}
  .vs{color:var(--muted);font-size:11px;font-weight:700}
  .live-tag{display:inline-block;background:rgba(255,77,94,.14);color:#ff7c89;
            border:1px solid rgba(255,77,94,.35);border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700}

  /* 球员状态 */
  .player{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
          padding:12px 13px;margin-bottom:9px}
  .prow{display:flex;align-items:center;gap:9px}
  .pname{font-weight:700;font-size:14px}
  .pstate{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
  .pstate.in{background:rgba(47,212,123,.15);color:var(--green)}
  .pstate.out{background:rgba(141,162,196,.12);color:var(--muted)}
  .bar{height:4px;background:#0b1424;border-radius:3px;margin:9px 0 6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:3px;transition:.3s}
  .pevidence{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px}

  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12px;
      border-bottom:1px dashed rgba(34,49,77,.7)}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{text-align:right;word-break:break-all}
  .ok{color:var(--green)}.warn{color:var(--amber)}.err{color:var(--red)}

  /* 右栏 */
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .tab{padding:6px 13px;border-radius:8px;font-size:12px;cursor:pointer;
       border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
  .tab.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  .filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
        color:var(--dim);cursor:pointer;background:transparent}
  .chip.active{border-color:var(--orange);color:var(--orange);background:rgba(255,106,61,.1)}
  .feed{max-height:560px;overflow-y:auto;padding-right:5px}
  .feed::-webkit-scrollbar{width:6px}
  .feed::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .item{display:flex;gap:11px;padding:11px 12px;border-radius:9px;background:var(--panel2);
        border:1px solid var(--line);margin-bottom:8px;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .item.hot{border-left:3px solid var(--red)}
  .item.warn{border-left:3px solid var(--amber)}
  .icol{width:4px;border-radius:3px;flex:none}
  .ibody{flex:1;min-width:0}
  .ihead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .etype{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
  .iname{font-weight:700;font-size:13px}
  .itime{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .itext{color:var(--dim);font-size:12px;margin-top:5px;word-break:break-word}
  .ifoot{display:flex;gap:10px;margin-top:6px;font-size:10px;color:var(--muted);flex-wrap:wrap}
  .chan{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);
        border-radius:4px;padding:1px 6px;font-size:10px}
  .empty{text-align:center;color:var(--muted);padding:44px 12px;font-size:12px;line-height:2}

  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .tools input{flex:1;min-width:140px}
  .hint{color:var(--muted);font-size:11px;margin-top:10px;line-height:1.8}
  code{background:#0c1526;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:#9fc0ff}
  .probe-result{margin-top:10px;font-size:11px;color:var(--dim);word-break:break-all;max-height:120px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><b>NBA</b> 关注球员实时提醒</div>
    <span class="badge"><i class="dot" id="wsDot"></i><span id="wsText">连接中…</span></span>
    <span class="badge" id="srcBadge">数据源 —</span>
    <span class="badge" id="demoBadge" style="display:none">演示模式</span>
    <span class="spacer"></span>
    <button onclick="refreshAll()">刷新</button>
    <button class="primary" onclick="testPush()">测试推送</button>
  </header>

  <div class="grid">
    <!-- 左栏 -->
    <div>
      <div class="card">
        <h2>当前比赛</h2>
        <div id="match"><div class="empty">等待比赛数据…</div></div>
      </div>

      <div class="card">
        <h2>关注球员 · 在场状态</h2>
        <div id="players"><div class="empty">尚未加载关注球员</div></div>
        <div class="hint">在场状态由 <b>画面 OCR</b> 判定；未配置直播流时，上场提醒回退到数据层换人事件。</div>
      </div>

      <div class="card">
        <h2>视觉模块</h2>
        <div id="vision"></div>
      </div>

      <div class="card">
        <h2>推送通道</h2>
        <div id="notifiers"></div>
      </div>
    </div>

    <!-- 右栏 -->
    <div>
      <div class="card">
        <h2>实时事件流</h2>
        <div class="tabs">
          <div class="tab active" data-tab="events" onclick="switchTab('events')">关注球员事件</div>
          <div class="tab" data-tab="alerts" onclick="switchTab('alerts')">推送记录</div>
          <span class="spacer"></span>
          <span class="badge" id="counter">0 条</span>
        </div>
        <div class="filters" id="filters"></div>
        <div class="feed" id="feed"><div class="empty">等待实时事件…<br>收到 WebSocket 推送后这里会自动更新</div></div>
      </div>

      <div class="card">
        <h2>快捷操作</h2>
        <div class="tools">
          <input id="newName" placeholder="球员英文名，如 Nikola Jokic">
          <input id="newJersey" placeholder="球衣号" style="max-width:90px">
          <button onclick="addPlayer()">添加关注</button>
        </div>
        <div class="tools">
          <input id="probeUrl" placeholder="直播间页面 URL（用于探测 m3u8）">
          <button onclick="probeStream()">探测流地址</button>
        </div>
        <div class="probe-result" id="probeResult"></div>
        <div class="hint">
          启动：<code>python run.py</code> → 浏览器打开 <code>http://127.0.0.1:8000</code>。
          配置在 <code>config.yaml</code>；密钥放 <code>.env</code>。
          无比赛时可设 <code>app.demo_mode: true</code> 回放样本事件验证全链路。
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const TYPES = {
  on_court:'画面上场', off_court:'画面离场', sub_in:'替补上场', sub_out:'被换下',
  score:'得分', assist:'助攻', turnover:'失误', rebound:'篮板',
  steal:'抢断', block:'盖帽', foul:'犯规', other:'其他'
};
const COLORS = {
  on_court:'#2fd47b', off_court:'#8fa2c4', sub_in:'#2fd47b', sub_out:'#8fa2c4',
  score:'#ff4d5e', assist:'#4d92ff', turnover:'#ffb547', rebound:'#a97bff',
  steal:'#14b8a6', block:'#8b5cf6', foul:'#64748b', other:'#64748b'
};
let ws=null, retry=0, allEvents=[], allAlerts=[], tab='events', filter='all', status={};

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(ts){try{return new Date(ts*1000).toLocaleTimeString('zh-CN',{hour12:false})}catch(e){return '--:--:--'}}

function connect(){
  const host = location.host || '127.0.0.1:8000';
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  try{ ws = new WebSocket(`${proto}://${host}/ws`); }catch(e){ schedule(); return; }
  ws.onopen=()=>{retry=0;setConn(true,'已连接');refreshAll()};
  ws.onmessage=ev=>{try{handle(JSON.parse(ev.data))}catch(e){console.warn(e)}};
  ws.onclose=()=>{setConn(false,'已断开，重连中');schedule()};
  ws.onerror=()=>{setConn(false,'连接失败，重连中')};
}
function schedule(){ if(ws) try{ws.close()}catch(e){}; const d=Math.min(15000,1000*Math.pow(1.6,retry++)); setTimeout(connect,d) }
function setConn(on,text){document.getElementById('wsDot').className='dot '+(on?'on':'off');document.getElementById('wsText').textContent=text}
setInterval(()=>{ if(ws&&ws.readyState===1) ws.send('ping') },25000);

async function refreshAll(){
  try{
    const [s,h]=await Promise.all([fetch('/api/status').then(r=>r.json()),fetch('/api/history').then(r=>r.json())]);
    renderStatus(s);
    allEvents=h.events||[]; allAlerts=h.alerts||[];
    if(h.presence&&h.presence.length) renderPresence(h.presence);
    renderFilters(); renderFeed();
  }catch(e){console.warn('刷新失败',e)}
}
function handle(msg){
  if(msg.type==='status') renderStatus(msg.data);
  else if(msg.type==='history'){allEvents=msg.data.events||[];allAlerts=msg.data.alerts||[];if(msg.data.presence)renderPresence(msg.data.presence);renderFilters();renderFeed()}
  else if(msg.type==='presence') renderPresence(msg.data);
  else if(msg.type==='event'){allEvents.unshift(msg.data);if(allEvents.length>300)allEvents.pop();renderFilters();renderFeed()}
  else if(msg.type==='alert'){allAlerts.unshift(msg.data);if(allAlerts.length>300)allAlerts.pop();if(tab==='alerts')renderFeed()}
}

function renderStatus(s){
  status=s||{};
  const src=s.source||{}, v=s.vision||{};
  document.getElementById('srcBadge').textContent='数据源 '+(src.source||'—')+(src.live_games!=null?` · ${src.live_games} 场进行中`:'');
  document.getElementById('srcBadge').title=src.probe||'';
  document.getElementById('demoBadge').style.display=s.demo?'inline-flex':'none';

  const games=s.games||[];
  const g=games.find(x=>x.status==='in')||games[games.length-1];
  document.getElementById('match').innerHTML = g ? `
    <div class="match">
      <div class="team"><div class="abbr">${esc(g.away.abbreviation||'AWAY')}</div><div class="score">${g.away_score}</div></div>
      <div class="vs">VS</div>
      <div class="team"><div class="abbr">${esc(g.home.abbreviation||'HOME')}</div><div class="score">${g.home_score}</div></div>
    </div>
    <div class="meta">${esc(g.label)} · Q${g.period} ${esc(g.clock)} · ${g.status==='in'?'<span class="live-tag">LIVE</span>':esc(g.detail||g.status)}</div>` : '<div class="empty">当前比赛日暂无比赛</div>';

  const pl=(s.watch||[]).map(p=>{
    const pr=(s.presence||[]).find(x=>x.player_name===p.name)||{};
    const conf=Math.round((pr.confidence||0)*100);
    return `<div class="player">
      <div class="prow"><span class="pname">${esc(p.name)}</span>
        <span style="color:var(--muted);font-size:11px">#${esc(p.jersey||'-')} ${esc(p.team||'')}</span>
        <span class="pstate ${pr.on_court?'in':'out'}">${pr.on_court?'在场':'未检出'}</span></div>
      <div class="bar"><i style="width:${conf}%"></i></div>
      <div class="pevidence">${esc(pr.evidence|| (v.enabled?'等待画面帧…':'画面模块未启用'))} · ${conf}%</div>
      <div class="tags">${(p.events||[]).map(t=>`<span class="tag">${esc(TYPES[t]||t)}</span>`).join('')}</div>
    </div>`;
  }).join('');
  document.getElementById('players').innerHTML=pl||'<div class="empty">未配置关注球员</div>';

  document.getElementById('vision').innerHTML=`
    <div class="kv"><span>启用</span><span class="${v.enabled?'ok':'warn'}">${v.enabled?'是':'否'}</span></div>
    <div class="kv"><span>后端</span><span>${esc(v.backend||'—')}</span></div>
    <div class="kv"><span>已处理帧</span><span>${v.frames||0}</span></div>
    <div class="kv"><span>状态</span><span class="${v.error?'err':'ok'}">${esc(v.error||'正常')}</span></div>
    <div class="kv"><span>流地址</span><span>${esc(v.stream_url||'未配置')}</span></div>`;

  document.getElementById('notifiers').innerHTML=(s.notifiers||[]).map(n=>
    `<div class="kv"><span>${esc(n.name)}</span><span class="${n.enabled?'ok':'warn'}">${n.enabled?'已启用':'未配置/停用'}</span></div>`).join('')||'<div class="empty">无通道</div>';
}
function renderPresence(list){
  status.presence=list;
  document.querySelectorAll('.pstate').forEach(()=>{});
  // 增量更新状态灯，避免整页重绘
  list.forEach(p=>{
    const card=[...document.querySelectorAll('.player')].find(el=>el.querySelector('.pname')?.textContent===p.player_name);
    if(!card)return;
    const st=card.querySelector('.pstate'); if(st){st.className='pstate '+(p.on_court?'in':'out');st.textContent=p.on_court?'在场':'未检出'}
    const bar=card.querySelector('.bar>i'); if(bar)bar.style.width=Math.round((p.confidence||0)*100)+'%';
    const ev=card.querySelector('.pevidence'); if(ev)ev.textContent=(p.evidence||'等待画面帧…')+' · '+Math.round((p.confidence||0)*100)+'%';
  });
}

function renderFilters(){
  const types=['all',...new Set(allEvents.map(e=>e.event_type))];
  document.getElementById('filters').innerHTML=types.map(t=>
    `<span class="chip ${filter===t?'active':''}" onclick="filter='${t}';renderFilters();renderFeed()">${t==='all'?'全部':esc(TYPES[t]||t)}</span>`).join('');
  document.getElementById('counter').textContent=(tab==='events'?allEvents.length:allAlerts.length)+' 条';
}
function switchTab(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.getElementById('filters').style.display=t==='events'?'flex':'none';renderFeed()}

function renderFeed(){
  const el=document.getElementById('feed');
  if(tab==='alerts'){
    el.innerHTML=allAlerts.length?allAlerts.map(a=>{
      const e=a.event||{}, ch=a.channels||{};
      return `<div class="item ${a.level==='hot'?'hot':a.level==='warn'?'warn':''}">
        <div class="icol" style="background:${COLORS[e.event_type]||'#64748b'}"></div>
        <div class="ibody">
          <div class="ihead"><span class="iname">${esc(a.title)}</span><span class="itime">${fmt(a.created_at)}</span></div>
          <div class="itext">${esc(e.text||a.body||'')}</div>
          <div class="ifoot">${Object.entries(ch).map(([k,v])=>`<span class="chan ${String(v).startsWith('ok')?'ok':'err'}">${esc(k)}: ${esc(v)}</span>`).join('')||'<span>无通道</span>'}</div>
        </div></div>`;
    }).join(''):'<div class="empty">暂无推送记录<br>可点右上角「测试推送」验证通道</div>';
    return;
  }
  const list=filter==='all'?allEvents:allEvents.filter(e=>e.event_type===filter);
  el.innerHTML=list.length?list.map(e=>`
    <div class="item ${e.event_type==='score'||e.event_type==='on_court'?'hot':e.event_type==='turnover'?'warn':''}">
      <div class="icol" style="background:${e.color||COLORS[e.event_type]||'#64748b'}"></div>
      <div class="ibody">
        <div class="ihead">
          <span class="etype" style="background:${e.color||COLORS[e.event_type]}22;color:${e.color||COLORS[e.event_type]}">${esc(e.event_label||TYPES[e.event_type]||e.event_type)}</span>
          <span class="iname">${esc(e.player_name)}</span>
          ${e.score_value?`<span style="color:var(--orange);font-weight:700">+${e.score_value}</span>`:''}
          <span class="itime">${fmt(e.ts)}</span>
        </div>
        <div class="itext">${esc(e.text)}</div>
        <div class="ifoot"><span>Q${e.period||'-'} ${esc(e.clock||'')}</span><span>比分 ${e.away_score}-${e.home_score}</span><span>${e.source==='vision'?'画面 OCR':esc(e.source||'')}</span></div>
      </div></div>`).join(''):'<div class="empty">暂无事件<br>关注球员产生行为后会实时出现在这里</div>';
  document.getElementById('counter').textContent=list.length+' 条';
}

async function addPlayer(){
  const n=document.getElementById('newName').value.trim(); if(!n)return alert('请输入球员名');
  const j=document.getElementById('newJersey').value.trim();
  const r=await fetch('/api/watch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:n,jersey:j,action:'add'})});
  const d=await r.json(); if(d.ok){document.getElementById('newName').value='';document.getElementById('newJersey').value='';refreshAll()}
}
async function testPush(){
  const n=(status.watch&&status.watch[0]&&status.watch[0].name)||'LeBron James';
  await fetch('/api/test?name='+encodeURIComponent(n),{method:'POST'});
  setTimeout(refreshAll,600);
}
async function probeStream(){
  const u=document.getElementById('probeUrl').value.trim(); const box=document.getElementById('probeResult');
  if(!u)return alert('请输入直播间页面 URL');
  box.textContent='探测中…';
  try{
    const r=await fetch('/api/probe?url='+encodeURIComponent(u)); const d=await r.json();
    if(d.error){box.innerHTML='<span class="err">'+esc(d.error)+'</span>';return}
    box.innerHTML=d.count?`找到 ${d.count} 个流地址：<br>`+d.streams.map(s=>`<div style="margin:4px 0">• <code>${esc(s)}</code></div>`).join('')+
      '<div class="hint">复制任一地址填入 config.yaml 的 <code>vision.stream_url</code> 后重启服务。</div>'
      :'未找到明文 m3u8（该站点可能由 JS 动态生成或做了混淆）。<br>请在浏览器 F12 → Network 过滤 <code>.m3u8</code>，复制地址填入 <code>vision.stream_url</code>。';
  }catch(e){box.innerHTML='<span class="err">请求失败：'+esc(e)+'</span>'}
}
connect();
</script>
</body>
</html>
